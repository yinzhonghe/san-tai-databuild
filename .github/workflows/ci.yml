name: 六派引擎测试

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 项目零依赖（无 package-lock.json），不能开 cache:npm，否则 setup-node 直接报缺 lock 文件失败
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 全局体检 · CI 源码模式（语法+不依赖运行时数据的测试）
        # main 分支不含运行时数据（宪法/kline/面板/生成js 在 data 分支或本地），
        # 用 --ci 只跑源码级检查；完整 6 项门禁在本地 node tools/preflight.js 跑。
        run: node tools/preflight.js --ci

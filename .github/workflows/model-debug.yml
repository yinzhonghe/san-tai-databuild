name: 模型接口调试

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 各家 LLM 端点可达性（不带 key，看是否 401 而不是 OK）
        run: |
          t() {
            printf '%-28s ' "$1"
            curl -sS -o /tmp/r -w '%{http_code} %{time_total}s ' -m 20 -X POST "$2" \
              -H 'Content-Type: application/json' -H 'Authorization: Bearer x' \
              -d '{"model":"m","messages":[{"role":"user","content":"hi"}]}' 2>&1
            head -c 120 /tmp/r | tr -d '\n'; echo
          }
          t deepseek   https://api.deepseek.com/chat/completions
          t openai     https://api.openai.com/v1/chat/completions
          t dashscope  https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
          t moonshot   https://api.moonshot.cn/v1/chat/completions
          t zhipu      https://open.bigmodel.cn/api/paas/v4/chat/completions
          t ghmodels   https://models.github.ai/inference/chat/completions
          echo "--- 对照：常规站点 ---"
          printf '%-28s ' eastmoney; curl -sS -o /dev/null -w '%{http_code} %{time_total}s\n' -m 20 "https://push2.eastmoney.com/api/qt/stock/get?secid=1.000001&fields=f43"

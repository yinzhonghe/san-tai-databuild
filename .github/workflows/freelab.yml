name: 自由推演实验室 · 每日一代（独立，与证据包自进化平行）

# 与 evolve_daily.yml【平行独立】：不动宪法封印/population/heartbeat。
# 流程：重建面板 → 生成真实市场画像 → 有 LLM_API_KEY 则大模型自由推演 →
#       真实结算逐条验钱 → 报告产物推 main 分支（build/Pages 自动发布）。
# 触发：SCF 每日 20:00 dispatch；额度闸保证重复触发不重复烧钱。
# 无 key 时也能跑：画像/验证/报告照常生成，只是不新增模型（诚实标「待首次推演」）。

on:
  workflow_dispatch:
    inputs:
      force:
        description: '调试强制推演（忽略额度闸，仍需 LLM_API_KEY）'
        required: false
        default: 'false'
      reason:
        description: '触发原因'
        required: false
        default: 'scheduled'

permissions:
  contents: write

concurrency:
  group: freelab-daily
  cancel-in-progress: false

jobs:
  freelab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 同步状态快照（data 分支的小文件）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/fl_state
          git clone --depth 1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/fl_state 2>/dev/null || echo "data 分支暂无，用 main 初始状态"
          # 2026-11-27 修复：宪法权威在 data 分支（main 无 learn/evolve/constitution.json）。
          # 不同步则 kernel.verifySeal 读到空文件 → 封印失效 → 所有模型 REJECT（云端训练空转）。
          mkdir -p learn/evolve
          for f in constitution.json constitution.seal.json; do
            if [ -f "/tmp/fl_state/learn/evolve/$f" ]; then cp "/tmp/fl_state/learn/evolve/$f" learn/evolve/ && echo "已从 data 同步 $f"; fi
          done
          if [ -d /tmp/fl_state/learn/evolve/freelab ]; then
            mkdir -p learn/evolve/freelab
            cp /tmp/fl_state/learn/evolve/freelab/*.json /tmp/fl_state/learn/evolve/freelab/*.jsonl learn/evolve/freelab/ 2>/dev/null || true
            echo "已同步 freelab 历史状态"
          fi
          # 资金流历史数据也在 data 分支续传（文件较大，单独同步）
          if [ -f /tmp/fl_state/learn/evolve/fundflow_hist.jsonl ]; then
            cp /tmp/fl_state/learn/evolve/fundflow_hist.jsonl learn/evolve/ 2>/dev/null || true
            echo "已同步ETF逐票资金流（续传基础）"
          fi
          # 批量报表产物 gz + 状态（已全量回补时直接复用，避免每天重复20分钟全量）
          if [ -f /tmp/fl_state/learn/evolve/fundflow_batch.jsonl.gz ]; then
            cp /tmp/fl_state/learn/evolve/fundflow_batch.jsonl.gz learn/evolve/ 2>/dev/null || true
            cp /tmp/fl_state/learn/evolve/fundflow_batch_status.json learn/evolve/ 2>/dev/null || true
            echo "已同步批量资金流 gz（复用基础）"
          fi
          # 批量报表分片（全市场个股+北交所，断点续传基础；不含ETF）
          if [ -d /tmp/fl_state/learn/evolve/fundflow_batch_shards ]; then
            mkdir -p learn/evolve/fundflow_batch_shards
            cp /tmp/fl_state/learn/evolve/fundflow_batch_shards/*.json learn/evolve/fundflow_batch_shards/ 2>/dev/null || true
            echo "已同步批量资金流分片"
          fi
          # ETF 批量（FTShare 东财ETF资金流按交易日全市场出数）+ 分片续传基础
          if [ -f /tmp/fl_state/learn/evolve/fundflow_etf.jsonl ]; then
            cp /tmp/fl_state/learn/evolve/fundflow_etf.jsonl /tmp/fl_state/learn/evolve/fundflow_etf_status.json learn/evolve/ 2>/dev/null || true
            echo "已同步ETF批量资金流"
          fi
          if [ -d /tmp/fl_state/learn/evolve/fundflow_etf_shards ]; then
            mkdir -p learn/evolve/fundflow_etf_shards
            cp /tmp/fl_state/learn/evolve/fundflow_etf_shards/*.json learn/evolve/fundflow_etf_shards/ 2>/dev/null || true
            echo "已同步ETF批量分片"
          fi

      - name: 重建面板（缺则建，失败不阻塞画像用采样）
        run: |
          if [ ! -f learn/evolve/panel_sample100k.jsonl ]; then
            python tools/build_kline.py 2>/dev/null || echo "kline重建跳过"
            node tools/evolve/panel.js 2>/dev/null || echo "面板重建跳过"
            node tools/evolve/make_sample.js 2>/dev/null || echo "采样重建跳过"
          else
            echo "面板采样已存在"
          fi

      - name: ⓪ 批量资金流回补（datacenter-web 全市场，含北交所；失败不阻塞）
        run: |
          # 2026-11-27 提速：push2his 逐票接口 IP 限流严重（40票/天太慢）。
          # datacenter RPT_DMSK_TS_FUNDFLOW 按交易日全市场出数，5000行/页约255页，
          # 单页间隔1s，一次全量回补；分片断点续传，重跑只补未完成页。
          # --skip-if-complete：gz 已覆盖当前 panel 全窗时直接复用（个股覆盖100%），
          #   避免每天重复20分钟全量抓取；panel 换新日期窗后自动重抓。
          python tools/fetch_fundflow_batch.py --interval 1.0 --skip-if-complete 2>&1 | tail -12 || echo "批量资金流本轮失败，保留已有数据"
          # ETF 不在批量报表内：FTShare 东财ETF资金流按交易日批量出数（2026-03-16起，约250页/几分钟），
          #   分片断点续传；2026-03-16 前无公开历史，标缺口不编造。
          python tools/fetch_etf_ftshare.py --interval 0.3 2>&1 | tail -10 || echo "ETF批量资金流本轮失败，保留已有数据"
          # push2his 逐票仅补 FTShare 未覆盖的少量尾部（GitHub runner 独立IP）
          python tools/fetch_fundflow_hist.py --only-etf --limit 20 --interval 6 2>&1 | tail -8 || echo "ETF资金流补抓跳过"
          node tools/evolve/freelab/fundflow_portrait.js 2>&1 || echo "资金流画像跳过"
          # 2026-11-27 接入验证闭环：把真实资金流 join 进样本 f（main5/superRatio5/accel/mainPctT），
          # 让大模型提出的资金流假设能被 settle 真实结算。缺数据 fail-closed 不填0。
          node tools/evolve/freelab/build_fundflow_samples.js 2>&1 || echo "资金流增强样本跳过"

      - name: ① 生成四时间维度真实收益样本（月/周/日/日内T0）
        # 从真实 kline 按 (code,date) 对齐，算 d20/d5/d1/intra；缺历史标缺口不编造
        run: node tools/evolve/freelab/horizon_sample.js

      - name: ①b 生成真实市场画像（含四维基准）
        run: node tools/evolve/freelab/facts.js

      - name: ② 大模型自由推演（有 key 才跑，额度闸保护）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODELS: ${{ secrets.LLM_MODELS }}
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          # 2026-11-27 修复：main 分支脚本在仓库根（不是 github_ci/），旧路径导致
          # python: can't open file ... 从未真正调过 LLM。两个路径都试，兼容布局。
          LLM_SCRIPT="github_ci/freelab_llm.py"
          if [ ! -f "$LLM_SCRIPT" ]; then LLM_SCRIPT="freelab_llm.py"; fi
          python "$LLM_SCRIPT" $FORCE 2>&1 || echo "自由推演跳过（无 key 或额度不足），不影响画像/验证/报告"
          python "$LLM_SCRIPT" --dry-run 2>&1 || true

      - name: ③ 真实结算逐条验钱（T+3 全样本）
        run: node tools/evolve/freelab/verify.js

      - name: ③b 四时间维度分类验证（月/周/日/日内T0 各自基准与五关）
        run: node tools/evolve/freelab/verify_horizons.js

      - name: ④ 生成报告（含四维度）
        run: node tools/evolve/freelab/report.js

      - name: 产物推 main 分支（供 build/Pages 发布）+ 状态推 data 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "freelab-bot"
          git config user.email "freelab-bot@users.noreply.github.com"
          # 报告推 main：build_site 会把 freelab_report.js 发布到站点
          git add freelab_report.js 2>/dev/null || true
          git diff --cached --quiet || git commit -m "freelab: 自由推演日报 $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
          # 历史状态推 data（不影响 main 体积）
          cd /tmp/fl_state 2>/dev/null || exit 0
          git config user.name  "freelab-bot"
          git config user.email "freelab-bot@users.noreply.github.com"
          mkdir -p learn/evolve/freelab
          cp "$GITHUB_WORKSPACE"/learn/evolve/freelab/{models.jsonl,verified.json,verified_horizons.json,facts.json,horizon_sample_status.json,llm_call_log.jsonl,llm_trigger.json,fundflow_portrait.json} learn/evolve/freelab/ 2>/dev/null || true
          # 资金流历史 + 状态推 data（续传基础，不进 main 避免体积膨胀）
          cp "$GITHUB_WORKSPACE"/learn/evolve/fundflow_hist.jsonl "$GITHUB_WORKSPACE"/learn/evolve/fundflow_status.json learn/evolve/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/learn/evolve/fundflow_batch.jsonl.gz "$GITHUB_WORKSPACE"/learn/evolve/fundflow_batch_status.json learn/evolve/ 2>/dev/null || true
          mkdir -p learn/evolve/fundflow_batch_shards
          cp "$GITHUB_WORKSPACE"/learn/evolve/fundflow_batch_shards/*.json learn/evolve/fundflow_batch_shards/ 2>/dev/null || true
          # ETF 批量资金流 + 分片推 data（续传基础）
          cp "$GITHUB_WORKSPACE"/learn/evolve/fundflow_etf.jsonl "$GITHUB_WORKSPACE"/learn/evolve/fundflow_etf_status.json learn/evolve/ 2>/dev/null || true
          mkdir -p learn/evolve/fundflow_etf_shards
          cp "$GITHUB_WORKSPACE"/learn/evolve/fundflow_etf_shards/*.json learn/evolve/fundflow_etf_shards/ 2>/dev/null || true
          git add -A
          git diff --cached --quiet || { git commit -m "freelab state $(date -u +%F)"; git push; }

      - name: 运行留痕
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freelab-log
          path: learn/evolve/freelab/verified.json
          if-no-files-found: ignore
          retention-days: 7

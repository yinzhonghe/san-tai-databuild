name: 数据构建

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample=小样本 / full=全量'
        required: true
        default: 'sample'
        type: choice
        options: [sample, full]
  push:
    paths:
      - 'build_data.py'
      - 'chan.py'
      - '.github/workflows/**'
  schedule:
    - cron: '35 7 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas 2>&1 | tail -5

      - name: 小样本试跑（30 只）
        if: github.event.inputs.mode != 'full' && github.event_name != 'schedule'
        run: |
          python build_data.py --site . --max 30 --no-ind --closes-len 20 2>&1 | tee build-run.log
          echo "exit=${PIPESTATUS[0]}" >> build-run.log

      - name: 全量构建
        if: github.event.inputs.mode == 'full' || github.event_name == 'schedule'
        run: |
          python build_data.py --site . --closes-len 61 2>&1 | tee build-run.log
          echo "exit=${PIPESTATUS[0]}" >> build-run.log

      - name: 写回构建摘要
        if: always()
        run: |
          {
            echo "time: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "trigger: ${{ github.event_name }} / mode=${{ github.event.inputs.mode }}"
            echo "--- files ---"
            ls -lh data.js data.json.gz 2>/dev/null || echo "未生成 data.js"
            echo "--- build info ---"
            grep -o '"asOf":"[^"]*"' data.js 2>/dev/null | head -1 || echo "no asOf"
            echo "code count: $(grep -o '"code":' data.js 2>/dev/null | wc -l)"
            echo "--- run log (tail 40) ---"
            tail -40 build-run.log 2>/dev/null || echo "no run log"
          } > build-log.txt 2>&1
          cat build-log.txt
          git config user.name  "san-tai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add build-log.txt || true
          git diff --cached --quiet || git commit -m "chore: 构建摘要"
          git push || true

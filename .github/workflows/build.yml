name: 数据构建

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample=小样本试跑 / full=全量'
        required: true
        default: 'sample'
        type: choice
        options: [sample, full]
  push:
    paths:
      - 'build_data.py'
      - 'chan.py'
      - '.github/workflows/**'
  schedule:
    - cron: '35 7 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: 小样本试跑（30 只）
        if: github.event.inputs.mode != 'full' && github.event_name != 'schedule'
        run: |
          python build_data.py --site . --max 30 --no-ind --closes-len 20
          ls -lh data.js data.json.gz 2>/dev/null || true

      - name: 全量构建
        if: github.event.inputs.mode == 'full' || github.event_name == 'schedule'
        run: |
          python build_data.py --site . --closes-len 61
          ls -lh data.js data.json.gz 2>/dev/null || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: data-build
          path: |
            data.js
            data.json.gz
          if-no-files-found: warn
          retention-days: 30

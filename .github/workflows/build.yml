name: 数据构建

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample=小样本(2分钟) / full=全量(约35分钟)'
        required: true
        default: 'sample'
        type: choice
        options: [sample, full]
  push:
    paths:
      - 'build_data.py'
      - 'chan.py'
      - 'six-engine.js'
      - '_etf_pick.json'
      - '_engine_cfg.json'
      - '_ind_map.json'
      - '_valuation.json'
      - '.github/workflows/build.yml'
  schedule:
    # 每个交易日 15:35（北京时间）= 07:35 UTC
    - cron: '35 7 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 把工具脚本放到根目录
        run: |
          cp .github/workflows/compute_engine.js ./compute_engine.js 2>/dev/null || true
          cp .github/workflows/_etf_pick.json  ./_etf_pick.json  2>/dev/null || true
          echo "--- 根目录依赖文件 ---"
          ls -lh compute_engine.js six-engine.js _engine_cfg.json _etf_pick.json _ind_map.json _valuation.json 2>/dev/null || true

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas 2>&1 | tail -3

      - name: 快速验证（100 只 + 525 ETF，含行业/估值）
        if: github.event.inputs.mode != 'full' && github.event_name != 'schedule'
        run: |
          set -o pipefail
          python build_data.py --site . --max 100 --closes-len 20 2>&1 | tee build-run.log
          echo "exit=${PIPESTATUS[0]}" >> build-run.log

      - name: 全量构建
        if: github.event.inputs.mode == 'full' || github.event_name == 'schedule'
        run: |
          set -o pipefail
          python build_data.py --site . --closes-len 61 2>&1 | tee build-run.log
          echo "exit=${PIPESTATUS[0]}" >> build-run.log

      - name: 写回构建摘要
        if: always()
        run: |
          {
            echo "time: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "trigger: ${{ github.event_name }} / mode=${{ github.event.inputs.mode }}"
            echo "--- files ---"
            ls -lh data.js 2>/dev/null || echo "未生成 data.js"
            echo "--- info ---"
            grep -o '"asOf":"[^"]*"' data.js 2>/dev/null | head -1 || echo "no asOf"
            echo "code count: $(grep -o '"code":' data.js 2>/dev/null | wc -l)"
            echo "--- run log (tail 40) ---"
            tail -40 build-run.log 2>/dev/null || echo "no run log"
          } > build-log.txt 2>&1
          cat build-log.txt
          git config user.name  "san-tai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add build-log.txt || true
          git diff --cached --quiet || git commit -m "chore: 构建摘要"
          git pull --rebase --autostash origin main || true
          git push || true

      - name: 发布数据到 data 分支（jsDelivr 从这里读）
        if: always()
        run: |
          if [ -f data.js ]; then
            ASOF=$(grep -o '"asOf":"[^"]*"' data.js | head -1 | sed 's/.*:"//;s/"//')
            CNT=$(grep -o '"code":' data.js | wc -l)
            SZ=$(stat -c%s data.js)
            printf '{"asOf":"%s","count":%s,"size":%s,"built":"%s"}\n' \
              "$ASOF" "$CNT" "$SZ" "$(date -u +%Y-%m-%dT%H:%MZ)" > version.json
            echo "--- version.json ---"
            cat version.json
            # 同时生成 gzip 版：前端 ?remote=1 时优先拉这个（约 2MB，比 9MB 快 4 倍）
            gzip -9 -c data.js > data.json.gz
            ls -lh data.js data.json.gz
            rm -rf /tmp/pub && mkdir -p /tmp/pub
            cp data.js data.json.gz version.json /tmp/pub/
            cd /tmp/pub
            git init -q
            git config user.name  "san-tai-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data.js data.json.gz version.json
            git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data
            echo "已推送到 data 分支"
          else
            echo "skip: 本次没有生成 data.js"
          fi

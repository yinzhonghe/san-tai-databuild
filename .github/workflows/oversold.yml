name: 超跌池生成

# 抓全市场 K 线 → 缠论一买 → 超跌池名单 → 自进化校准 → 产物推到 data 分支（Pages 可读）。
# 北京时间 16:30 跑（等 build.yml 15:35 的 data.js 构建完成并推上 data 分支之后）。

on:
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: '跳过抓数（用仓库里已有的 ohlc/hist，调试用）'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
permissions:
  contents: write

concurrency:
  group: oversold-gen
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 东财统一限流 + 腾讯三入口轮换后，单只请求变慢但覆盖率大幅提升，留足时间
    # 6079 只 × hist/ohlc 双通道 + ETF，按闸门限速实测约 200+ 分钟；100 分钟会在抓数中途被取消。
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 取最新全市场快照
        run: |
          curl -sfL --retry 3 --retry-delay 5 \
            "https://yinzhonghe.github.io/san-tai-databuild/data.js?t=$(date +%s)" -o data.js
          # 自进化/点评归档要读 daily.js；旧版只拉 data.js，导致 ENOENT 丢归档
          curl -sfL --retry 2 --retry-delay 3 \
            "https://yinzhonghe.github.io/san-tai-databuild/daily.js?t=$(date +%s)" -o daily.js \
            || echo "daily.js 暂缺，点评归档步骤会跳过"
          ls -lh data.js daily.js 2>/dev/null || true
          printf '标的数: %s\n' "$(grep -o '"code":' data.js | wc -l)"

      - name: 抓 K 线（个股 + ETF，11 年日 K）
        if: github.event.inputs.skip_fetch != 'true'
        run: |
          set -e
          t0=$(date +%s)
          # 2026-11-24：三个脚本统一走 tools/fetch_gate.js
          #   东财：单出口限流 + 抖动 + 失败退避（旧版 8~10 并发猛拉单入口，云端被风控后只剩 1281/5461）
          #   腾讯：三入口轮换 + 每入口最小间隔；hfq/qfq 与东财复权口径一致
          #   新浪：限速 + 重试；ETF 另有腾讯三入口兜底
          # 并发降到 4：闸门已限制全局速率，再高只会堆积等待，不提速
          node tools/fetch_hist.js 4
          node tools/fetch_ohlc.js 4
          # ETF 走新浪源，合并进同一个 ohlc.json.gz（带 isETF 标记），
          # 不跑这步 chan_pick 的 ETF 池会是空的（nEtf=0）
          node tools/fetch_etf_ohlc.js 4
          echo "抓数耗时 $(( $(date +%s) - t0 ))s"
          ls -lh hist.json.gz ohlc.json.gz

      - name: 缠论一买 + 超跌池名单 + 新发涨停观察
        run: |
          set -e
          node --max-old-space-size=8192 tools/chan_pick.js
          node --max-old-space-size=8192 tools/final_pick.js
          # 新发涨停观察：从当日 ohlc 回放最新新发池 + 打分 + 台账
          # 失败不阻塞主链路（超跌页会提示「数据未加载」而不是静默用旧稿）
          # 主站口径「启动·新发」真实台账：先拉主站最新 data.js，再生成 limitup_data.js
          curl -sfL --retry 3 --retry-delay 5 "https://yinzhonghe.github.io/san-tai-databuild/data.js?t=$(date +%s)" -o data.js || echo "主站 data.js 拉取失败，沿用上一版"
          echo "主站基准: $(grep -o '"asOf":"[^"]*"' data.js | head -1)"
          # 2026-11-25：新发口径与三态主站共用 state-phase.js；同时挖真实规律并回写样本留痕
          node tools/limitup_live.js || echo "主站口径新发台账失败，沿用上轮 limitup_data.js"
          ls -lh chan_pick_data.js oversold_data.js
          [ -f limitup_data.js ] && ls -lh limitup_data.js || true

      - name: 自进化校准（失败不阻塞，保留上轮参数）
        run: |
          node --max-old-space-size=8192 tools/evolve_all.js || echo "自进化失败，沿用上轮 learn/chan_params.json"
          [ -f learn_report.js ] && ls -lh learn_report.js || echo "无 learn_report.js"

      - name: 产物推到 data 分支（站点从这里读）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FILES=""
          for f in chan_pick_data.js oversold_data.js learn_report.js limitup_data.js; do
            [ -f "$f" ] && FILES="$FILES $f=$f"
          done
          echo "推送:$FILES"
          python gh_put.py "${{ github.repository }}" data $FILES --msg "oversold: $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: 学习状态回写 main（下次运行继续累积）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=""
          for f in learn/limitup_live.jsonl learn/limitup_rules.json learn/limitup_stats.jsonl learn/chan_params.json learn/chan_ledger.jsonl learn/chan_history.jsonl \
                   learn/index_hist.json learn/commentary_rules.md learn/report.json \
                   learn/state_calib.json learn/verdict_stats.json \
                   learn/chan_signals.json.gz learn/brief_log.jsonl learn/brief_scored.jsonl; do
            [ -f "$f" ] && FILES="$FILES $f=$f"
          done
          echo "回写:$FILES"
          python gh_put.py "${{ github.repository }}" main $FILES --msg "learn: 状态回写 $(date -u +%Y-%m-%dT%H:%MZ)" || echo "回写失败（不影响产物）"

      - name: 摘要
        if: always()
        run: |
          echo "=== 产出 ==="
          ls -lh chan_pick_data.js oversold_data.js learn_report.js 2>/dev/null || true
          echo "=== 缠论参数 ==="
          head -c 300 learn/chan_params.json 2>/dev/null || true
          echo ""
          echo "=== 主站口径新发台账（末行）==="
          tail -c 300 learn/limitup_live.jsonl 2>/dev/null || true

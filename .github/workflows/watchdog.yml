name: 三报自检补漏

# 主任务 report.yml 的 cron 在 GitHub 免费层会漂移/漏触发（实测配置 07:30/11:35/15:05，
# 实际常跑成 08:10/12:41 甚至整天不跑）。本任务在每档多个错开时间点检查：
#   2026-11-24 起改为「一次补齐所有已过时段」——旧版只看当前档，
#   13:58 那次判定为 noon，永远不会检查 close；收盘 cron 又漏触发 → 全天没有收盘复盘。
#   现在每次运行都按北京时间算出「应该已经生成」的档位集合，逐档检查、缺哪档补哪档（幂等）。
# 完全云端闭环，不依赖本机开机。用 GITHUB_TOKEN 直接读/推文件，不 dispatch（绕开 GitHub 防递归限制）。

on:
  workflow_dispatch:
    inputs:
      slot:
        description: '只检查某一档（auto=按当前时间补齐所有已过档位）'
        required: true
        default: 'auto'
        type: choice
        options: [auto, morning, noon, close]
  schedule:
    # 早报：主 07:30，自检 07:55 / 08:25 / 08:55（北京）= UTC 23:55(prev) / 00:25 / 00:55
    - cron: '55 23 * * 0-4'
    - cron: '25 0 * * 1-5'
    - cron: '55 0 * * 1-5'
    # 午间：主 11:35，自检 12:00 / 12:30 / 13:00（北京）= UTC 04:00 / 04:30 / 05:00
    - cron: '0 4 * * 1-5'
    - cron: '30 4 * * 1-5'
    - cron: '0 5 * * 1-5'
    # 收盘：主 15:05，自检 15:25 / 15:55 / 16:25 / 16:55 / 17:25（北京）
    - cron: '25 7 * * 1-5'
    - cron: '55 7 * * 1-5'
    - cron: '25 8 * * 1-5'
    - cron: '55 8 * * 1-5'
    - cron: '25 9 * * 1-5'
    # 晚间保险：20:00 北京（UTC 12:00）最后一次兜底，补齐当天所有缺档
    - cron: '0 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: report-gen          # 与主 report.yml 同组，避免同时在跑生成
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查当天哪些档位缺失（所有已过时段）
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_SLOT: ${{ github.event.inputs.slot }}
        run: |
          python - <<'PY' >> $GITHUB_OUTPUT
          import os, json, urllib.request, base64, datetime
          tok = os.environ['GH_TOKEN']
          manual = (os.environ.get('MANUAL_SLOT') or '').strip()
          if manual == 'auto': manual = ''
          now = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
          today = now.strftime('%Y-%m-%d')
          mins = now.hour * 60 + now.minute

          # 主档时间 + 合理宽限：过了这个点还没有 oneLine 就算缺
          due = []
          if mins >= 8 * 60:  due.append('morning')   # 主 07:30
          if mins >= 10 * 60 + 40: due.append('am_flash')  # 盘中 10:30（宽限 10 分钟）
          if mins >= 12 * 60: due.append('noon')      # 主 11:35
          if mins >= 14 * 60 + 10: due.append('pm_flash')  # 盘中 14:00（宽限 10 分钟）
          if mins >= 15 * 60 + 10: due.append('close')  # 主 15:05
          if manual: due = [manual]                    # 手动指定时只查这一档

          url = 'https://api.github.com/repos/yinzhonghe/san-tai-databuild/contents/daily.js?ref=data'
          req = urllib.request.Request(url, headers={'Authorization':'Bearer '+tok,'User-Agent':'watchdog','Accept':'application/vnd.github+json'})
          obj = {}
          try:
              d = json.loads(urllib.request.urlopen(req, timeout=30).read())
              js = base64.b64decode(d['content']).decode('utf-8','ignore')
              obj = json.loads(js[js.find('{'):js.rfind('}')+1])
          except Exception as e:
              print('读取 daily.js 失败，按全部缺失处理：%s' % e)

          missing = []
          intra = obj.get('intraday') or []
          for s in due:
              if s in ('am_flash', 'pm_flash'):
                  want = '10:30' if s == 'am_flash' else '14:00'
                  ok = any((it.get('date') == today and it.get('slot') == want and it.get('change'))
                           for it in intra if isinstance(it, dict))
              else:
                  v = obj.get(s) or {}
                  ok = (obj.get('date') == today and bool(v.get('oneLine')))
              if not ok:
                  missing.append(s)
          # 诊断信息写到 stderr：GitHub Actions 把 stdout 全当 key=value 解析，
          # 之前这行中文日志导致 "Invalid format" 让整个自检步骤失败、补漏从未执行。
          import sys
          sys.stderr.write('北京 %s → 应生成 %s，缺失 %s\n' % (now.strftime('%F %H:%M'), ','.join(due) or '无', ','.join(missing) or '无'))
          print('missing=%s' % ','.join(missing))
          print('has_missing=%s' % ('true' if missing else 'false'))
          PY

      - name: 缺哪些档就补哪些档
        if: steps.check.outputs.has_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ vars.LLM_API_BASE }}
          LLM_MODELS: ${{ vars.LLM_MODELS }}
          LLM_TIER: high
          MISSING: ${{ steps.check.outputs.missing }}
        run: |
          for s in $(echo "$MISSING" | tr ',' ' '); do
            if [ "$s" = "am_flash" ] || [ "$s" = "pm_flash" ]; then
              echo "=== 补跑盘中快报 $s ==="
              python gen_intraday.py --slot "$s" 2>&1 | tee -a watchdog-run.log
            else
              echo "=== 补跑 $s 档（high）==="
              python gen_report.py --slot "$s" 2>&1 | tee -a watchdog-run.log
            fi
          done

      - name: 提交运行记录
        if: always()
        run: |
          git config user.name  "san-tai-bot"
          git config user.email "bot@users.noreply.github.com"
          cp watchdog-run.log watchdog-last-run.log 2>/dev/null || true
          git add watchdog-last-run.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "watchdog: $(TZ=Asia/Shanghai date '+%F %H:%M')"
          git pull --rebase --autostash origin main || true
          git push || true

      - name: 结果摘要
        if: always()
        run: |
          echo "### 三报自检补漏" >> $GITHUB_STEP_SUMMARY
          echo "- 检查时间（北京）：$(TZ=Asia/Shanghai date '+%F %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "- 缺失档位：${{ steps.check.outputs.missing }}" >> $GITHUB_STEP_SUMMARY
          echo "- 已生成则跳过，缺哪档补哪档（一次补齐所有已过时段）" >> $GITHUB_STEP_SUMMARY

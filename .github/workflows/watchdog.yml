name: 三报自检补漏

# 主任务 report.yml 的 cron 在 GitHub 免费层会漂移/漏触发（实测配置 07:30/11:35/15:05，
# 实际常跑成 08:10/12:41 甚至不跑）。本任务在每档多个错开时间点检查：
#   当天该档已生成 → 跳过（幂等，不重复消耗额度）；
#   未生成 → 直接生成该档并推送。
# 完全云端闭环，不依赖本机开机。用 GITHUB_TOKEN 直接读/推文件，不 dispatch（绕开 GitHub 防递归限制）。

on:
  workflow_dispatch:
    inputs:
      slot:
        description: '检查哪一档：auto=按北京时间判断当前档'
        required: true
        default: 'auto'
        type: choice
        options: [auto, morning, noon, close]
  schedule:
    # 早报：主 07:30，自检 07:55 / 08:25 / 08:55（北京）= UTC 23:55(prev) / 00:25 / 00:55
    - cron: '55 23 * * 0-4'
    - cron: '25 0 * * 1-5'
    - cron: '55 0 * * 1-5'
    # 午间：主 11:35，自检 12:00 / 12:30 / 13:00（北京）= UTC 04:00 / 04:30 / 05:00
    - cron: '0 4 * * 1-5'
    - cron: '30 4 * * 1-5'
    - cron: '0 5 * * 1-5'
    # 收盘：主 15:05，自检 15:25 / 15:55 / 16:25（北京）= UTC 07:25 / 07:55 / 08:25
    - cron: '25 7 * * 1-5'
    - cron: '55 7 * * 1-5'
    - cron: '25 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: report-gen          # 与主 report.yml 同组，避免同时在跑生成
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 判定时段
        id: pick
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ] || [ "$SLOT" = "auto" ]; then
            H=$(TZ=Asia/Shanghai date +%H)
            M=$(TZ=Asia/Shanghai date +%M)
            if   [ "$H" -lt 10 ]; then SLOT=morning
            elif [ "$H" -lt 14 ]; then SLOT=noon
            else SLOT=close; fi
          fi
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "北京 $(TZ=Asia/Shanghai date '+%F %H:%M') → 自检档位 $SLOT"

      - name: 检查当天该档是否已生成
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOT: ${{ steps.pick.outputs.slot }}
        run: |
          python - <<'PY' >> $GITHUB_OUTPUT
          import os, json, urllib.request, base64, datetime
          tok = os.environ['GH_TOKEN']; slot = os.environ['SLOT']
          today = (datetime.datetime.utcnow() + datetime.timedelta(hours=8)).strftime('%Y-%m-%d')
          url = 'https://api.github.com/repos/yinzhonghe/san-tai-databuild/contents/daily.js?ref=data'
          req = urllib.request.Request(url, headers={'Authorization':'Bearer '+tok,'User-Agent':'watchdog','Accept':'application/vnd.github+json'})
          try:
              d = json.loads(urllib.request.urlopen(req, timeout=30).read())
              js = base64.b64decode(d['content']).decode('utf-8','ignore')
              i, j = js.find('{'), js.rfind('}')
              obj = json.loads(js[i:j+1])
              v = obj.get(slot) or {}
              exists = bool(obj.get('date') == today and v.get('oneLine'))
              at = v.get('at','')
              print('结论：当天该档%s（at=%s）' % ('已生成' if exists else '未生成', at))
              print('exists=%s' % ('true' if exists else 'false'))
              print('at=%s' % at)
          except Exception as e:
              print('检查失败，按未生成处理：%s' % e)
              print('exists=false')
              print('at=')
          PY

      - name: 未生成则补跑
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ vars.LLM_API_BASE }}
          LLM_MODELS: ${{ vars.LLM_MODELS }}
          LLM_TIER: high
        run: |
          echo "当天 ${{ steps.pick.outputs.slot }} 档未生成，启动补跑（high 档）"
          python gen_report.py --slot ${{ steps.pick.outputs.slot }} 2>&1 | tee watchdog-run.log

      - name: 提交运行记录
        if: always()
        run: |
          git config user.name  "san-tai-bot"
          git config user.email "bot@users.noreply.github.com"
          cp watchdog-run.log watchdog-last-run.log 2>/dev/null || true
          git add watchdog-last-run.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "watchdog(${{ steps.pick.outputs.slot }}): $(TZ=Asia/Shanghai date '+%F %H:%M')"
          git pull --rebase --autostash origin main || true
          git push || true

      - name: 结果摘要
        if: always()
        run: |
          echo "### 三报自检补漏：${{ steps.pick.outputs.slot }}" >> $GITHUB_STEP_SUMMARY
          echo "- 检查时间（北京）：$(TZ=Asia/Shanghai date '+%F %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "- 当天该档已生成：${{ steps.check.outputs.exists }}（at ${{ steps.check.outputs.at }}）" >> $GITHUB_STEP_SUMMARY
          echo "- 已生成则跳过，未生成则补跑并推送 daily.js" >> $GITHUB_STEP_SUMMARY
